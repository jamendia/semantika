project:
  type: book
  output-dir: _site
  resources:
    - assets/

book:
  title: "Esanahia eta egitura"
  subtitle: "Interpretazioaren zientzia"
  author: "Jamendia"
  date: "2026"
  language: eu
  repo-url: https://github.com/jamendia/semantika
  repo-branch: main
  repo-actions: [edit, issue]
  site-url: https://jamendia.github.io/semantika/
  sidebar:
    style: docked
    search: true
    collapse-level: 1
  page-footer:
    left: "© 2026 Jamendia · [CC BY 4.0](LICENSE)"
    right: "Eraikia Quartorekin"
  search: true
  chapters:
    - index.qmd
    - hitzaurrea.qmd
    - nola-irakurri.qmd
    - part: "I. Esanahia eta konposizioa"
      chapters:
        - kapituluak/konposizioa.qmd
  appendices:
    - eranskinak/a-terminologia.qmd
    - eranskinak/b-ikurrak.qmd
    - eranskinak/c-aipamena.qmd

lang: eu

bibliography: bibliografia.bib
csl: estilo/unified-style-sheet-for-linguistics.csl
filters:
  - tresnak/linguistika.lua

crossref:
  exm-title: "Adibidea"
  exr-title: "Ariketa"

format:
  html:
    theme:
      - cosmo
      - estilo/basque.scss
    toc: true
    toc-depth: 3
    number-sections: true
    anchor-sections: true
    link-external-icon: false
    fig-cap-location: bottom
    tbl-cap-location: top
  pdf:
    engine: lualatex
    keep-tex: true
    include-in-header: tex/aurrea.tex
    toc: true
    number-sections: true
    colorlinks: true

execute:
  echo: false
  warning: false

editor: source
