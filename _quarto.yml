project:
  type: book
  output-dir: _site
  resources:
    - assets/
    # Letra-tipoak (woff2) estekak estilo/letrak/letrak.css-tik erreferentziatzen
    # ditu; baina Quarto-k ez ditu automatikoki kopiatzen, beraz hemen zerrendatu.
    - estilo/letrak/

book:
  title: "Esanahia eta egitura"
  subtitle: "Interpretazioaren zientzia"
  author: "jamendia"
  date: "2026"
  language: eu
  repo-url: https://github.com/jamendia/semantika
  repo-branch: main
  repo-actions: [edit, issue]
  site-url: https://jamendia.github.io/semantika/
  sidebar:
    style: docked
    search: true
    collapse-level: 1
  page-footer:
    left: "© 2026 jamendia · [CC BY 4.0](LICENSE)"
    right: "Quartorekin Egina"
  search: true
  chapters:
    - index.qmd
    - hitzaurrea.qmd
    - nola-irakurri.qmd
    - part: "I. Esanahia eta konposizioa"
      chapters:
        - kapituluak/01-sarrera.qmd
        - kapituluak/02-hitza-perpausa-predikatua.qmd
        - kapituluak/konposizioa.qmd
        - kapituluak/04-tresna-kutxa.qmd
        - kapituluak/05-semantika-lexikoa.qmd
    - part: "II. Erreferentzia eta mundua"
      chapters:
        - kapituluak/06-kuantifikazioa.qmd
        - kapituluak/07-aditzak.qmd
        - kapituluak/08-modalitatea.qmd
        - kapituluak/09-intentsionalitatea.qmd
    - part: "III. Erabilera"
      chapters:
        - kapituluak/10-pragmatika-sarrera.qmd
        - kapituluak/11-inplikaturak.qmd
        - kapituluak/12-indar-ilokutiboa.qmd
        - kapituluak/13-informazio-egitura.qmd
    - part: "IV. Bigarren liburukia: gai aurreratuak"
      chapters:
        - kapituluak/14-presuposizioa.qmd
        - kapituluak/15-denbora-aspektua.qmd
        - kapituluak/16-pluralak.qmd
        - kapituluak/17-konparazioa.qmd
        - kapituluak/18-metafora.qmd
        - kapituluak/19-kortesia.qmd
  appendices:
    - eranskinak/a-terminologia.qmd
    - eranskinak/b-ikurrak.qmd
    - eranskinak/c-aipamena.qmd

lang: eu

pdf-engine: xelatex

bibliography: bibliografia.bib
csl: estilo/unified-style-sheet-for-linguistics.csl
filters:
  - tresnak/linguistika.lua

crossref:
  exm-title: "Adibidea"
  exr-title: "Ariketa"

format:
  html:
    # Gaia proiektuaren barruan dago (estilo/gaia.scss), ez luzapen batean:
    # horrela `quarto render --to html`-ek gaia zuzen aplikatzen du.
    theme:
      light: [estilo/gaia.scss]
      dark: [estilo/gaia.scss, estilo/gaia-iluna.scss]
    css: [estilo/letrak/letrak.css, estilo/basque.css]
    toc: true
    toc-depth: 3
    number-sections: true
    anchor-sections: true
    link-external-icon: false
    fig-cap-location: bottom
    tbl-cap-location: top
  pdf:
    engine: xelatex
    keep-tex: false
    include-in-header: tex/aurrea.tex
    toc: true
    number-sections: true
    colorlinks: true

execute:
  echo: false
  warning: false

editor: source
