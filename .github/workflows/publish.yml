name: Argitaratu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  eraiki:
    runs-on: ubuntu-latest
    steps:
      - name: Biltegia deskargatu
        uses: actions/checkout@v4

      - name: Python prestatu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Quarto prestatu
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Terminologia birsortu
        run: python tresnak/hiztegia.py

      - name: Kalitate-egiaztapena
        run: python tresnak/terminoak-egiaztatu.py

      - name: Hiztegia sinkronizatuta dagoela egiaztatu
        run: |
          git diff --exit-code -- eranskinak/a-terminologia.qmd \
            || (echo "::error::a-terminologia.qmd zaharkituta dago." && exit 1)

      - name: Errendatu (HTML)
        run: quarto render --to html

      - name: Gaia zuzena kargatu dela egiaztatu
        # Babes-hesia: `--to html`-ek gaia isilka baztertuko balu (lehen
        # gertatu zen bezala), hemen huts egin behar du, ez argitaratu.
        run: |
          test -f _site/estilo/basque.css \
            || { echo "::error::estilo/basque.css ez da _site-ra kopiatu"; exit 1; }
          test -f _site/estilo/letrak/letrak.css \
            || { echo "::error::estilo/letrak/letrak.css falta da"; exit 1; }
          test -f _site/estilo/letrak/roboto-v29-latin-regular.woff2 \
            || { echo "::error::letra-tipoak ez dira _site-ra kopiatu"; exit 1; }
          grep -q "estilo/basque.css" _site/index.html \
            || { echo "::error::index.html-ek ez du estilo/basque.css kargatzen"; exit 1; }
          grep -q -- "--sidebar-bg-docked" _site/site_libs/bootstrap/*.css \
            || { echo "::error::gaia pertsonalizatua ez da konpilatu (theme falta da)"; exit 1; }

      - name: HTML ostprozesatu (adibideen etiketak)
        run: python tresnak/ostprozesatu.py

      - name: Pages prestatu
        uses: actions/configure-pages@v5
        with:
          # GitHub Pages automatikoki gaitzen du (Source: GitHub Actions),
          # eskuz konfiguratu beharrik gabe.
          enablement: true

      - name: Artifacta igo
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  argitaratu:
    needs: eraiki
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages-era argitaratu
        id: deployment
        uses: actions/deploy-pages@v4
