name: Kalitatea

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  egiaztatu:
    runs-on: ubuntu-latest
    steps:
      - name: Biltegia deskargatu
        uses: actions/checkout@v4

      - name: Python prestatu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Quarto prestatu
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: TinyTeX prestatu (PDFarentzat)
        uses: r-lib/actions/setup-tinytex@v2

      - name: LaTeX paketeak instalatu
        run: |
          tlmgr install \
            etbb alegreya fira tex-gyre-math stmaryrd \
            expex forest newunicodechar babel-basque \
            unicode-math fontspec latexmk \
            koma-script selnolig parskip xurl bookmark

      - name: Terminologia birsortu
        run: python tresnak/hiztegia.py

      - name: Zuhaitzak egiaztatu (SVGak biltegian daudela)
        run: python tresnak/arbolak.py --check

      - name: Kalitate-egiaztapena
        run: python tresnak/terminoak-egiaztatu.py

      - name: Errendatzearen proba (HTML + PDF)
        run: quarto render

      - name: HTML ostprozesatu
        run: python tresnak/ostprozesatu.py

      - name: Zenbakitze globala egiaztatu
        run: python tresnak/ostprozesatu.py --check
